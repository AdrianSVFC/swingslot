{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 540px;">
  <h1 class="h3 mb-4">Create your account</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <fieldset class="mb-3">
      <legend class="form-label fs-6">I am a…</legend>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="role" id="role-student" value="student"
          {% if form.get('role', 'student') == 'student' %}checked{% endif %}>
        <label class="form-check-label" for="role-student">Golfer</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="role" id="role-instructor" value="instructor"
          {% if form.get('role') == 'instructor' %}checked{% endif %}>
        <label class="form-check-label" for="role-instructor">Instructor</label>
      </div>
    </fieldset>
    <div class="mb-3">
      <label for="name" class="form-label">Full name</label>
      <input id="name" name="name" class="form-control" required value="{{ form.get('name', '') }}" autocomplete="name">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" name="email" type="email" class="form-control" required value="{{ form.get('email', '') }}" autocomplete="email">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password" name="password" type="password" class="form-control" required minlength="8" autocomplete="new-password" aria-describedby="pw-help">
      <div id="pw-help" class="form-text">At least 8 characters.</div>
    </div>
    <div class="mb-4">
      <label for="confirm" class="form-label">Confirm password</label>
      <input id="confirm" name="confirm" type="password" class="form-control" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-fairway w-100">Sign up</button>
  </form>
  <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
