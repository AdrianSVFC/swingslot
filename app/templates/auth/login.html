{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 480px;">
  <h1 class="h3 mb-4">Log in</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" name="email" type="email" class="form-control" required autocomplete="email">
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input id="password" name="password" type="password" class="form-control" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-fairway w-100">Log in</button>
  </form>
  <p class="mt-3 text-center">New to SwingSlot? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
